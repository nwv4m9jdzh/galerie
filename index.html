<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie maleb</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__inner">
    <p class="site-title" data-i18n="authorName">[Jméno autora]</p>
    <button type="button" id="lang-toggle" class="lang-toggle" aria-label="Přepnout jazyk">EN</button>
  </div>
</header>

<main id="gallery" class="gallery" aria-live="polite">
  <p id="gallery-empty" class="gallery-empty" data-i18n="emptyGallery" hidden></p>
</main>

<footer class="bottombar">
  <div class="bottombar__inner">
    <p class="footer-label" data-i18n="footerContact">Kontakt</p>
    <a class="footer-phone" href="tel:+420777172121">+420 777 17 21 21</a>
    <a class="footer-email" href="mailto:snyrch@icloud.com">snyrch@icloud.com</a>
  </div>
</footer>

<div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Prohlížeč obrazu">
  <button type="button" id="lightbox-close" class="lightbox__close" data-i18n-attr-aria-label="lightboxClose" aria-label="Zavřít">&times;</button>
  <button type="button" id="lightbox-prev" class="lightbox__nav lightbox__nav--prev" data-i18n-attr-aria-label="lightboxPrev" aria-label="Předchozí">&#8249;</button>
  <button type="button" id="lightbox-next" class="lightbox__nav lightbox__nav--next" data-i18n-attr-aria-label="lightboxNext" aria-label="Další">&#8250;</button>
  <figure class="lightbox__figure">
    <img id="lightbox-image" src="" alt="">
    <figcaption id="lightbox-caption"></figcaption>
  </figure>
</div>

<script src="js/i18n.js"></script>
<script src="js/lightbox.js"></script>
<script src="js/main.js"></script>
</body>
</html>
